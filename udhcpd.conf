# X10Pro BusyBox udhcpd sample from a tested unit.
# WARNING: On a different unit, keep its original DHCP network/interface config.
# Only merge the last 3 directives into the original config.
start 192.168.169.2
end 192.168.169.254
interface wlan0
opt subnet 255.255.255.0
opt router 192.168.169.1
opt lease 864000
pidfile /var/run/udhcpd.pid
auto_time 5
lease_file /tmp/udhcpd-x10pro.leases
notify_file /data/x10pro-display/udhcpd-notify.sh
